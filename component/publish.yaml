Edition: 3.0.0
Type: Component
Name: xcompress
Provider:
  - 阿里云
  - 腾讯云
Version: 0.1.3
Description: Compress serverless function code before deploy — bundle Node deps into one minified file or slim the Python package — to reduce cold-start time.
HomePage: https://github.com/anycodes/xCompress
Effective: Public
Tags:
  - 代码压缩
  - 冷启动优化
  - cold-start
Category: 其它
Service:
  函数计算:
    Authorities:
      - 读取代码目录
Commands:
  compress: Bundle (Node) or slim (Python) the function code and print a before/after report
Parameters:
  type: object
  additionalProperties: true
  properties:
    src:
      type: string
      required: false
      description: Project directory to compress (relative to s.yaml)
    runtime:
      type: string
      required: false
      description: node | python
      default: node
      enum:
        - node
        - python
    engine:
      type: string
      required: false
      description: Bundling engine
      default: auto
      enum:
        - auto
        - esbuild
        - rollup
        - webpack
    level:
      type: string
      required: false
      description: Compression level preset
      default: medium
      enum:
        - low
        - medium
        - high
    out:
      type: string
      required: false
      description: Output directory for the compressed artifact
      default: dist
    externals:
      type: array
      required: false
      description: Modules to keep external (not bundled)
    assets:
      type: array
      required: false
      description: Extra files/dirs to copy into the output
    platform:
      type: string
      required: false
      description: Informational target hint (fc or scf)
    nodeTarget:
      type: string
      required: false
      description: esbuild Node.js target (for example node18)
    minify:
      type: boolean
      required: false
      description: Minify the output (default true)
    sourcemap:
      type: boolean
      required: false
      description: Emit a source map
    keepNames:
      type: boolean
      required: false
      description: Preserve function and class names
    handler:
      type: string
      required: false
      description: Handler export name for self-check
      default: handler
    check:
      type: boolean
      required: false
      description: Load the built artifact and validate the handler export
      default: true
    dropConsole:
      type: boolean
      required: false
      description: Remove console calls during minification
      default: false
    pyStripSo:
      type: boolean
      required: false
      description: Strip debug symbols from Python shared objects
      default: false
    pyPruneMeta:
      type: boolean
      required: false
      description: Remove Python dist-info and egg-info metadata
      default: false
